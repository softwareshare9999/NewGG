name: NewGG

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: newgg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux-x86-64
            os: ubuntu-24.04
            artifact: NewGG-Linux-x86-64
            extra_cmake: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DNEWGG_USE_LIBCXX=ON -DNEWGG_ARCH=x86-64
          - name: Windows-x86-64
            os: windows-latest
            artifact: NewGG-Windows-x86-64.exe
            extra_cmake: -DNEWGG_ARCH=x86-64
          - name: macOS-x86-64
            os: macos-latest
            artifact: NewGG-macOS-x86-64
            extra_cmake: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DNEWGG_ARCH=x86-64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.config.extra_cmake }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Locate binary
        shell: bash
        run: |
          mkdir -p dist
          if [ -f build/NewGG ]; then
            BIN=build/NewGG
          elif [ -f build/Release/NewGG.exe ]; then
            BIN=build/Release/NewGG.exe
          elif [ -f build/NewGG.exe ]; then
            BIN=build/NewGG.exe
          else
            echo "Built NewGG binary not found"
            find build -name 'NewGG*' -type f
            exit 1
          fi
          chmod +x "$BIN" || true
          if command -v strip >/dev/null 2>&1 && [[ "$BIN" != *.exe ]]; then
            strip "$BIN" || true
          fi
          cp "$BIN" "dist/${{ matrix.config.artifact }}"
          for ini in build/ggX64set2017.ini build/Release/ggX64set2017.ini; do
            if [ -f "$ini" ]; then
              cp "$ini" dist/ggX64set2017.ini
              break
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact }}
          path: dist/*

  build-windows-arch:
    name: Windows-${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [AVX2, BMI2, AVX512, AVXVNNI, VNNI512]
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DNEWGG_ARCH=${{ matrix.arch }}

      - name: Build
        run: cmake --build build --parallel 4

      - name: Locate binary
        run: |
          if [ ! -f build/NewGG.exe ]; then
            echo "Built NewGG binary not found"
            find build -name 'NewGG*' -type f
            exit 1
          fi
          mkdir -p dist
          strip build/NewGG.exe || true
          cp build/NewGG.exe "dist/NewGG-Windows-${{ matrix.arch }}.exe"
          if [ -f build/ggX64set2017.ini ]; then
            cp build/ggX64set2017.ini dist/ggX64set2017.ini
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: NewGG-Windows-${{ matrix.arch }}
          path: dist/*

  build-android:
    name: Android-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NDKV: "28.2.13676358"

    steps:
      - uses: actions/checkout@v4

      - name: Install NDK
        run: |
          ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          echo "y" | $SDKMANAGER "ndk;$NDKV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDKV" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DNEWGG_ARCH=arm64 \
            -DNEWGG_ANDROID_STATIC=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Locate binary
        run: |
          if [ -f build/NewGG ]; then
            BIN=build/NewGG
          else
            echo "Built NewGG binary not found"
            find build -name 'NewGG*' -type f
            exit 1
          fi
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" "$BIN" || true
          cp "$BIN" NewGG-Android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: NewGG-Android-arm64
          path: NewGG-Android-arm64

  package:
    name: NewGG
    runs-on: ubuntu-latest
    needs: [build, build-windows-arch, build-android]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: NewGG-*
          path: Artifacts

      - name: Collect binaries
        run: |
          mkdir -p dist
          find Artifacts -type f -name 'NewGG-*' -exec cp {} dist/ \;
          find Artifacts -type f -name 'ggX64set2017.ini' -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: NewGG
          path: |
            dist/NewGG-*
            dist/ggX64set2017.ini
            README.md
            CMakeLists.txt
